    <script>
      // Suppress Vite HMR WebSocket connection errors in sandbox/iframe environment
      window.addEventListener('error', function(event) {
        if (
          event.filename && event.filename.includes('@vite/client') ||
          (event.message && (
            event.message.includes('WebSocket') ||
            event.message.includes('ws://') ||
            event.message.includes('wss://') ||
            event.message.includes('failed to connect to websocket')
          ))
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (
          String(event.reason).includes('WebSocket') ||
          String(event.reason?.stack || '').includes('@vite/client')
        )) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  </body>
